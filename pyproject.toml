[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldquant-api-simulator"
version = "0.1.0"
description = "Minimal WorldQuant BRAIN API simulation runner"
requires-python = ">=3.8"
dependencies = [
  "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
